services:
  redis:
    image: redis:7-alpine
    container_name: faraz_aur_code
    ports:
      - "6379:6379"
    command: [
      "redis-server",
      "--appendonly",
      "yes"
    ]
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7
    container_name: faraz_aur_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: faraz_aur_redis
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  mongo_data:






